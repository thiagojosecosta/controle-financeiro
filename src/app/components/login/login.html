<div class="login-container">
  <button
    type="button"
    class="theme-toggle-btn"
    (click)="toggleTheme()"
    title="Alternar tema"
  >
    <i class="fas" [ngClass]="theme() === 'dark' ? 'fa-sun' : 'fa-moon'"></i>
  </button>
  <div class="brand-header">
    <span class="brand-icon">$</span>
    <h1 class="brand-name">EasyMoney</h1>
    <p class="brand-tagline">
      Gerencie suas receitas e despesas em um só lugar, de forma simples e
      intuitiva.
    </p>
  </div>
  <div class="login-box">
    <h2>Acessar Sistema</h2>
    <form (ngSubmit)="onSubmit()">
      <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input
          type="email"
          placeholder="Email"
          name="email"
          [(ngModel)]="credentials.email"
          required
        />
      </div>

      <div class="input-group password-wrapper">
        <i class="fas fa-lock"></i>
        <input
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Senha"
          name="pass"
          [(ngModel)]="credentials.pass"
          required
        />
        <i
          class="fas password-icon"
          [ngClass]="showPassword ? 'fa-eye' : 'fa-eye-slash'"
          (click)="togglePasswordVisibility()"
        ></i>
      </div>

      <button type="submit" class="btn-login">Entrar</button>
      <a routerLink="/register" class="link-register">Criar Conta</a>
    </form>
  </div>
</div>
